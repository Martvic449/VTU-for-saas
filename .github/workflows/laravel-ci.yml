name: Laravel CI

on:
  push:
    branches: [main, deployment-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vtu_saas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vtu_saas_test
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Laravel's Composer scripts (notably package:discover) bootstrap the
      # framework and require bootstrap/cache to exist and be writable.
      # These runtime directories are intentionally not committed to Git.
      - name: Prepare writable Laravel runtime directories
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          mkdir -p \
            bootstrap/cache \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs
          chmod -R u+rwX bootstrap/cache storage
          test -d bootstrap/cache
          test -w bootstrap/cache
          test -w storage

      - name: Prepare non-secret test environment
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_mysql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f composer.lock
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked

      - name: Verify Hostinger public_html hardening
        shell: bash
        run: |
          set -euo pipefail
          test -s .htaccess
          test -s public/.htaccess
          test -s public/index.php
          grep -Fq 'RewriteRule ^(.*)$ public/$1 [L]' .htaccess
          grep -Fq 'vendor' .htaccess
          grep -Fq 'composer' .htaccess
          grep -Fq 'private-config' docs/HOSTINGER_PRIVATE_DEPLOYMENT.md

      - name: Run Laravel tests
        run: php artisan test

      - name: Check changed PHP syntax
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          changed_php="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.php')"
          if [ -n "$changed_php" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] || php -l "$file"
            done <<< "$changed_php"
          else
            echo "No changed PHP files to syntax-check."
          fi
