name: Laravel CI

on:
  push:
    branches: [main, deployment-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: vtu_saas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vtu_saas_test
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Laravel's Composer scripts (notably package:discover) bootstrap the
      # framework and require bootstrap/cache to exist and be writable.
      # These runtime directories are intentionally not committed to Git.
      - name: Prepare writable Laravel runtime directories
        shell: bash
        run: |
          set -euo pipefail
          umask 0022
          mkdir -p \
            bootstrap/cache \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs
          chmod -R u+rwX bootstrap/cache storage
          test -d bootstrap/cache
          test -w bootstrap/cache
          test -w storage

      - name: Prepare non-secret test environment
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example
          cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_mysql, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Resolve dependencies and install
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -f composer.lock ]; then
            echo "lockfile_bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            composer update --no-interaction --prefer-dist --no-progress
            echo "lockfile_bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      # The first CI run creates the lock file. Commit only that generated
      # lock file to a same-repository PR branch; never write to a fork.
      - name: Commit generated Composer lock to pull request
        if: steps.resolve.outputs.lockfile_bootstrapped == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const content = fs.readFileSync('composer.lock').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'composer.lock',
              message: 'build: commit resolved Composer dependency lock',
              content,
              branch
            });

      - name: Upload initial Composer lock (if missing from repository)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-bootstrap
          path: composer.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Laravel tests
        run: php artisan test

      - name: Check PHP formatting
        shell: bash
        run: |
          set -euo pipefail
          changed_php="$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" -- '*.php' | tr '\n' ' ')"
          if [ -n "$changed_php" ]; then
            # Enforce formatting on this change set without making an unrelated
            # historical formatting backlog block every future deployment.
            vendor/bin/pint --test $changed_php
          else
            echo "No changed PHP files to format-check."
          fi
