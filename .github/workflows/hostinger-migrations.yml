name: Hostinger production migrations

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PORT SSH_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}."
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Wait for Hostinger Git deployment and run safe migrations
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/hostinger_key -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          TARGET="$SSH_USER@$SSH_HOST"

          # Hostinger's Git deployment is asynchronous. Do not run Artisan
          # against the previous release: wait until the deployed checkout
          # contains the exact commit whose CI run just passed.
          ready=false
          for attempt in $(seq 1 30); do
            if "${SSH[@]}" "$TARGET" "cd '$DEPLOY_PATH' && git rev-parse HEAD 2>/dev/null" 2>/dev/null | grep -qx "$DEPLOY_SHA"; then
              ready=true
              break
            fi
            echo "Waiting for Hostinger to deploy commit $DEPLOY_SHA ($attempt/30)..."
            sleep 10
          done

          if [ "$ready" != true ]; then
            echo "::error::Hostinger did not expose the expected deployed Git commit within five minutes. No migration was run."
            exit 1
          fi

          "${SSH[@]}" "$TARGET" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          if [ ! -f artisan ] || [ ! -f vendor/autoload.php ]; then
            echo "Laravel artisan or Composer dependencies are missing; refusing to migrate."
            exit 1
          fi

          if [ ! -f ../private-config/.env ]; then
            echo "The private production environment file ../private-config/.env is missing; refusing to migrate."
            exit 1
          fi

          test -d bootstrap/cache && test -w bootstrap/cache || {
            echo "bootstrap/cache is missing or not writable."
            exit 1
          }

          # This is deliberately migrate (not migrate:fresh or db:wipe).
          # Laravel applies only migrations not yet recorded in the migrations table.
          php artisan migrate --force
          REMOTE
